[package]
name = "jxl-ui"
version = "0.5.3"
edition = "2021"
description = "A cross-platform JPEG XL image viewer built with egui"
authors = ["Harald Januschka"]
license = "BSD-3-Clause"
repository = "https://github.com/hjanuschka/jxl-ui"
keywords = ["jpeg-xl", "jxl", "image-viewer", "egui"]
categories = ["multimedia::images", "gui"]

[[bin]]
name = "jxl-ui"
path = "src/main.rs"

[dependencies]
# JXL decoding
jxl = { git = "https://github.com/hjanuschka/jxl-rs.git", branch = "jxl-encoder-cargo", features = ["all-simd", "encoder-vardct"] }

# egui GUI framework (cross-platform)
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }

# File picker
rfd = "0.15"

# Utilities
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# Image processing
image = "0.25"

# Half-precision floats for F16 support
half = "2"

# HTTP for URL loading
reqwest = { version = "0.12", features = ["blocking"] }

# Open URLs in browser
open = "5"

[profile.dev]
opt-level = 2

# Workaround for upstream jxl-rs debug overflow panic in LF preview path
# (progressive_5.jxl with PR697). Keep checks for our crate, disable in decoder deps.
[profile.dev.package.jxl]
overflow-checks = false

[profile.dev.package.jxl_transforms]
overflow-checks = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
