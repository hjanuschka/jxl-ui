[package]
name = "jxl-mobile-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "jxl_mobile_core"
crate-type = ["staticlib", "cdylib"]

[dependencies]
jxl = { git = "https://github.com/hjanuschka/jxl-rs.git", branch = "jxl-encoder-cargo", features = ["all-simd"] }
half = "2"
jni = { version = "0.21", optional = true }

[features]
default = []
android = ["jni"]

[profile.release]
# Optimize for decode speed on device/emulator (not binary size).
opt-level = 3
lto = true
codegen-units = 1
strip = true
